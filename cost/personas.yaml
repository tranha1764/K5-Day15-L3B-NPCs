# Mô phỏng chi phí khi dùng thật — Đề tài D1: Xử lý khiếu nại đơn giao đồ ăn

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản (khớp spec.md §2)
  low: 500
  base: 1000
  high: 3000
  source: "Track D — quy mô nhóm người dùng mục tiêu triển khai thử nghiệm (tự ước tính, khớp spec.md §2)"

personas:           # 3 kiểu người dùng từ khảo sát n = 23 phiếu hợp lệ (evidence/survey/results.csv); share cộng = 1.0
  - name: dat_it
    share: 0.48             # 11/23 người đặt 0–5 lần/tháng
    uses_per_month: 1       # trung bình 1 phiên khiếu nại/hỏi đáp mỗi tháng (tự ước tính)
    turns_per_session: 1    # 1 lượt hỏi trong phiên
    source: "Khảo sát n = 23 (11/23 đặt 0–5 lần/tháng, evidence/survey/results.csv)"
  - name: dat_vua
    share: 0.39             # 9/23 người đặt 6–10 lần/tháng
    uses_per_month: 2       # trung bình 2 phiên khiếu nại/tháng (tự ước tính)
    turns_per_session: 2    # 2 lượt hỏi/bổ sung thông tin trong phiên
    source: "Khảo sát n = 23 (9/23 đặt 6–10 lần/tháng, evidence/survey/results.csv)"
  - name: dat_nhieu
    share: 0.13             # 3/23 người đặt trên 10 lần/tháng
    uses_per_month: 4       # trung bình 4 phiên/tháng gồm cả nhóm khiếu nại tần suất cao (tự ước tính)
    turns_per_session: 2    # 2 lượt hỏi trong phiên
    source: "Khảo sát n = 23 (3/23 đặt >10 lần/tháng, evidence/survey/results.csv)"

prices:             # USD / 1 triệu token
  - model: gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "https://openai.com/api/pricing/ · xem 28/11/2026"
  - model: gpt-4o
    input: 2.50
    output: 10.00
    source: "https://openai.com/api/pricing/ · xem 28/11/2026"

usd_to_vnd:
  rate: 25400
  source: "Tỷ giá quy đổi tham chiếu 25.400 VND/USD (28/11/2026)"
